server:
  port: 8000

spring:
  application:
    name: gestao-usuarios
  profiles:
    active: test

  sql:
    init:
      schema-locations: file:../data/ddl.sql
      data-locations: file:../data/dml.sql
      continue-on-error: false

  datasource:
    url: jdbc:h2:mem:testdb
    username: root
    password: root
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 0
      maximum-pool-size: 15
      connection-timeout: 3000
      idle-timeout: 300000
      max-lifetime: 600000
      initialization-fail-timeout: -1
      validation-timeout: 1000

  jpa:
    generate-ddl: false
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

api:
  security:
    token:
      secret: ${JWT_SECRET:silencio}
